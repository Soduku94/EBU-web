{% extends "base.html" %}

{% block title %}{{ post.title }} - Blog Home Fit Pro{% endblock %}

{% block content %}
<div class="blog-post-container">

    <!-- HEADER -->
    <header class="blog-post-header">
        <h1 class="blog-post-title">{{ post.title }}</h1>

        <div class="blog-post-meta-detail">
            <span>
                <i class="bi bi-person-circle me-1 text-primary"></i>
                <strong>{{ post.author.username }}</strong>
            </span>
            <span class="text-muted">|</span>
            <span>
                <i class="bi bi-calendar-event me-1 text-primary"></i>
                {{ post.timestamp.strftime('%d tháng %m, %Y') }}
            </span>
        </div>
    </header>

    <!-- CONTENT -->
    <article class="blog-post-content">
        {{ post.body | safe }}
    </article>

    <!-- FOOTER / NAVIGATION -->
    <div class="mt-5 mb-5 pt-4 border-top">
        <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('main.blog_index') }}" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-2"></i> Quay lại Blog
            </a>

            <div class="share-buttons">
                <span class="text-muted me-2 small uppercase fw-bold">Chia sẻ:</span>
                <a href="#" class="btn btn-sm btn-light rounded-circle text-primary"><i class="bi bi-facebook"></i></a>
                <a href="#" class="btn btn-sm btn-light rounded-circle text-info"><i class="bi bi-twitter"></i></a>
                <a href="#" class="btn btn-sm btn-light rounded-circle text-danger"><i class="bi bi-pinterest"></i></a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
