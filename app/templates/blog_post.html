{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mt-4">{{ post.title }}</h1>
            
            <p class="lead">
                viết bởi <strong>{{ post.author.username }}</strong>
                vào {{ post.timestamp.strftime('%d-%m-%Y') }}
            </p>
            <hr>
            
            <div class="blog-body-content">
                {{ post.body | safe }}
            </div>
            
            <hr>
            </div>
    </div>
</div>
{% endblock %}
